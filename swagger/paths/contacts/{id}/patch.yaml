tags:
  - Contacts
summary: Update contact by ID
operationId: updateContact
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      description: Contact's unique ID
      example: 65e4decdd286b30065d54af9
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'Joun Dohe'

          phoneNumber:
            description: "Contact's phone number"
            type: string
            example: '+380123456789'

          email:
            description: "Contact's email"
            type: string
            example: 'joun@example.com'

          isFavourite:
            description: Would you like or not?
            type: boolean
            example: false

          contactType:
            description: "Contact's work place"
            type: string
            example: work
            enum: ['work', 'home', 'personal']
            default: 'personal'

          photo:
            description: "Contact's photo"
            type: string
            format: binary
responses:
  '200':
    description: Contact updated successfully
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully patched a contact!'
            data:
              type: object
              $ref: '../../../components/schemas/contact.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
